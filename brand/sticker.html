<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Punta Espada · order sticker</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Inter:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #9aa8b0; font-family: Inter, system-ui, sans-serif; }
    .wrap { padding: 28px; display: flex; flex-direction: column; gap: 28px; align-items: center; }
    .sq {
      width: 420px; height: 420px; position: relative; overflow: hidden;
      background: #1b3144; color: #f3f1ea;
      border-radius: 36px;
      box-shadow: 0 18px 40px rgba(0,0,0,.28);
      padding: 22px 22px 18px;
      display: flex; flex-direction: column; align-items: center;
    }
    .sq .top { display: flex; align-items: center; gap: 10px; width: 100%; }
    .sq .logo { width: 52px; height: 52px; border-radius: 50%; background: #fff; object-fit: cover; }
    .sq .k { font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: #8ec4c4; font-weight: 800; }
    .sq h1 { font-family: Cormorant Garamond, serif; font-style: italic; font-size: 26px; margin: 0; font-weight: 600; line-height: 1; }
    .sq .qrbox {
      margin: 14px 0 10px; background: #f3f1ea; border-radius: 22px; padding: 10px;
      box-shadow: 0 0 0 3px #3f8587;
    }
    .sq .qrbox img { width: 210px; height: 210px; display: block; }
    .sq .cta { font-size: 18px; font-weight: 800; letter-spacing: -.02em; margin: 0; }
    .sq .sub { font-size: 12px; color: #b7d6d4; margin: 4px 0 0; font-weight: 700; }

    .bar {
      width: 640px; height: 220px; background: #1b3144; color: #f3f1ea;
      border-radius: 28px; padding: 18px 22px;
      display: grid; grid-template-columns: 1fr 180px; gap: 16px; align-items: center;
      box-shadow: 0 18px 40px rgba(0,0,0,.28);
    }
    .bar .logo { width: 64px; height: 64px; border-radius: 50%; background: #fff; object-fit: cover; }
    .bar .row { display: flex; align-items: center; gap: 12px; }
    .bar .k { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: #8ec4c4; font-weight: 800; }
    .bar h1 { font-family: Cormorant Garamond, serif; font-style: italic; font-size: 34px; margin: 2px 0 6px; font-weight: 600; }
    .bar p { margin: 0; font-size: 15px; font-weight: 700; }
    .bar small { display: block; margin-top: 4px; color: #b7d6d4; font-size: 12px; font-weight: 700; }
    .bar .qr {
      background: #f3f1ea; border-radius: 18px; padding: 8px;
      outline: 3px solid #3f8587; outline-offset: 0;
    }
    .bar .qr img { width: 148px; height: 148px; display: block; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="sq" id="sq">
      <div class="top">
        <img class="logo" src="logo.png" alt="" />
        <div>
          <div class="k">Cap Cana · Golf</div>
          <h1>Punta Espada</h1>
        </div>
      </div>
      <div class="qrbox"><img src="qr-order.png" alt="QR" /></div>
      <p class="cta">Snack &amp; bar · scan to order</p>
      <p class="sub">Punta Espada · Las Iguanas</p>
    </div>

    <div class="bar" id="bar">
      <div>
        <div class="row">
          <img class="logo" src="logo.png" alt="" />
          <div>
            <div class="k">Snack &amp; Bar</div>
            <h1>Snack &amp; bar · scan to order</h1>
          </div>
        </div>
        <p>Punta Espada · Las Iguanas</p>
        <small>Cap Cana</small>
      </div>
      <div class="qr"><img src="qr-order.png" alt="QR" /></div>
    </div>
  </div>
</body>
</html>
