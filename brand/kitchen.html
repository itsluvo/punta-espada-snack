<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1b3144" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Kitchen · Punta Espada Snack &amp; Bar</title>
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" href="logo.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #1b3144;
      --teal: #3f8587;
      --paper: #f3f1ea;
      --line: #dde3df;
      --tap: 44px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { background: #12202c; }
    body { margin: 0; font-family: Inter, system-ui, sans-serif; color: #1c2a32; touch-action: manipulation; }
    .phone {
      max-width: 430px; margin: 0 auto; min-height: 100dvh; background: var(--paper);
      box-shadow: 0 0 80px rgba(0,0,0,.4);
    }
    @media (max-width: 480px) {
      html { background: var(--paper); }
      .phone { max-width: none; box-shadow: none; }
    }
    header {
      background: var(--navy); color: #fff;
      padding: max(14px, env(safe-area-inset-top)) 16px 14px;
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
    }
    header .left { display: flex; align-items: center; gap: 10px; }
    header img { width: 44px; height: 44px; border-radius: 50%; background: #fff; }
    h1 { font-family: "Cormorant Garamond", serif; font-style: italic; font-size: 22px; margin: 0; font-weight: 600; }
    .wrap { padding: 16px; display: grid; gap: 12px; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
    .card.new { border-color: var(--teal); box-shadow: 0 0 0 2px rgba(63,133,135,.25); }
    .meta { font-size: 12px; color: #6a7780; }
    .loc { font-weight: 800; color: var(--navy); font-size: 18px; }
    ul { margin: 8px 0 0; padding-left: 18px; }
    .btns { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    button { border: 0; border-radius: 12px; min-height: var(--tap); padding: 0 14px; font-weight: 700; font: inherit; }
    .go { background: var(--navy); color: #fff; }
    .ok { background: var(--teal); color: #fff; }
    .no { background: #eee; color: var(--navy); }
    #login { padding: 0 0 32px; min-height: 100dvh; }
    .login-hero { position: relative; height: 220px; overflow: hidden; background: var(--navy); }
    .login-hero img.bg { width: 100%; height: 100%; object-fit: cover; display: block; }
    .login-hero .fade { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 20%, var(--paper) 100%); }
    .login-body { padding: 0 24px; margin-top: -56px; position: relative; }
    #login img.logo { width: 96px; height: 96px; border-radius: 50%; display: block; margin: 0 auto 16px; background: #fff; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
    #login h1 { text-align: center; color: var(--navy); }
    #login p { text-align: center; color: #6a7780; font-size: 13px; }
    input {
      width: 100%; min-height: var(--tap); padding: 12px; border-radius: 12px;
      border: 1px solid var(--line); font: inherit;
    }
  </style>
</head>
<body>
  <div class="phone">
    <div id="login">
      <div class="login-hero">
        <img class="bg" src="photos/hero.jpg?v=20260928fairway" alt="" />
        <div class="fade"></div>
      </div>
      <div class="login-body">
        <img class="logo" src="logo.png?v=20260901pe1" alt="Punta Espada" />
        <div style="letter-spacing:.16em;font-size:11px;font-weight:700;color:#3f8587;text-align:center">CAP CANA</div>
        <h1>Kitchen</h1>
        <p>PIN</p>
        <input id="pin" type="password" inputmode="numeric" />
        <button class="go" style="width:100%;margin-top:12px" id="enter">Enter</button>
      </div>
    </div>
    <div id="board" hidden>
      <header>
        <div class="left">
          <img src="logo.png?v=20260901pe1" alt="" />
          <h1>Punta Espada</h1>
        </div>
        <span><a href="/office" style="color:#b7d6d4;font-weight:700;text-decoration:none">Oficina</a> · <span id="count"></span></span>
      </header>
      <div class="wrap" id="orders"></div>
    </div>
  </div>
  <script>
    let token = sessionStorage.getItem("golf-kit") || "";
    let payingId = "";
    const $ = (id) => document.getElementById(id);
    function locEs(o) {
      const course = o.course || "";
      const cart = o.golfCart ? "Carrito " + o.golfCart : "";
      if (o.hole) return [course, "Hoyo " + o.hole, cart].filter(Boolean).join(" · ");
      return String(o.location || "—").replace(/\bHole\b/g, "Hoyo").replace(/\bCart\b/g, "Carrito");
    }
    async function login() {
      const res = await fetch("/api/cashier/login", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ pin: $("pin").value }),
      });
      if (!res.ok) { alert("Wrong PIN"); return; }
      const d = await res.json();
      token = d.token;
      sessionStorage.setItem("golf-kit", token);
      $("login").hidden = true;
      $("board").hidden = false;
      load();
      setInterval(load, 4000);
    }
    async function load() {
      const res = await fetch("/api/orders", { headers: { Authorization: "Bearer " + token } });
      if (!res.ok) return;
      const data = await res.json();
      const list = (data.orders || data || []).filter((o) => o.status !== "done" && o.status !== "cancelled");
      list.sort((a, b) => (b.ts || 0) - (a.ts || 0));
      $("count").textContent = list.length + " open";
      $("orders").innerHTML = list.map((o) => {
        const items = (o.items || []).map((i) => {
          const bits = [i.bread, i.pick, (i.ings || []).join(", "), i.note].filter(Boolean).join(" · ");
          return `<li><strong>${i.qty}× ${i.name}</strong>${bits ? " — " + bits : ""}</li>`;
        }).join("");
        return `<article class="card ${o.status === "new" ? "new" : ""}">
          <div class="loc">${locEs(o)}</div>
          <div class="meta">#${o.id} · $${Number(o.total || 0).toFixed(2)}${o.golfCart ? " · Carrito " + o.golfCart : ""}${o.cartNote ? " · " + o.cartNote : ""}</div>
          <ul>${items}</ul>
          <div class="btns">
            ${payingId === o.id
              ? `<button class="go" data-id="${o.id}" data-pay="cash">Efectivo</button>
                 <button class="ok" data-id="${o.id}" data-pay="card">Tarjeta</button>`
              : `<button class="ok" data-id="${o.id}" data-st="done">Entregado</button>`}
          </div>
        </article>`;
      }).join("") || "<p>No open orders.</p>";
    }
    $("enter").onclick = login;
    $("pin").addEventListener("keydown", (e) => { if (e.key === "Enter") login(); });
    $("orders").onclick = async (e) => {
      const b = e.target.closest("[data-id]");
      if (!b) return;
      if (b.dataset.st === "done") { payingId = b.dataset.id; load(); return; }
      const body = { status: "done" };
      if (b.dataset.pay) body.pay = b.dataset.pay;
      else return;
      await fetch("/api/order/" + b.dataset.id, {
        method: "PATCH",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
        body: JSON.stringify(body),
      });
      payingId = "";
      load();
    };
    if (token) { $("login").hidden = true; $("board").hidden = false; load(); setInterval(load, 4000); }
  </script>
</body>
</html>
